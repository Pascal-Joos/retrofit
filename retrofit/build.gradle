plugins {
  id 'java'
  id("net.ltgt.errorprone") version "3.0.1"
  id 'com.diffplug.spotless' version '6.25.0'
  id "org.jetbrains.kotlin.jvm"
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  kotlinOptions {
    jvmTarget = "11"
  }
}

apply plugin: 'java-library'
repositories {
  mavenLocal()
  mavenCentral()
}

spotless {
    java {
        googleJavaFormat('1.17.0') // or latest compatible with Java 17
        target 'src/**/*.java'
    }
}

dependencies {
  // Main dependencies
  compileOnly "com.squareup.okhttp3:okhttp:4.9.3"
  compileOnly "com.squareup.okio:okio:3.2.0"
  compileOnly "com.google.android:android:4.1.1.4"
  compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"
  compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
  compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.6.4"
  compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.6.4"
  compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4"
  compileOnly "com.google.code.findbugs:jsr305:3.0.2"
  compileOnly "com.google.code.findbugs:findbugs-annotations:3.0.1"
  compileOnly "org.codehaus.mojo:animal-sniffer-annotations:1.20"

  annotationProcessor "com.uber.nullaway:nullaway:0.12.4-SNAPSHOT"
  annotationProcessor "edu.ucr.cs.riple.annotator:annotator-scanner:1.3.16-SNAPSHOT"
  implementation "edu.ucr.cs.riple.annotator:annotation-util:1.3.16-SNAPSHOT"
  errorprone "com.google.errorprone:error_prone_core:2.35.1"
  errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
  compileOnly "com.uber.nullaway:nullaway-annotations:0.12.4-SNAPSHOT"

  // Test dependencies
  testImplementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.6.4"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.6.4"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4"
  testImplementation "com.squareup.okhttp3:okhttp:4.9.3"
  testImplementation "com.squareup.okio:okio:3.2.0"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.9.3"
  testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.3"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
  testImplementation "org.assertj:assertj-core:3.24.2"
  testImplementation "org.junit.vintage:junit-vintage-engine:5.9.3"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.mockito:mockito-core:4.8.1"
  testImplementation "org.mockito:mockito-inline:4.8.1"
  testImplementation "org.mockito:mockito-junit-jupiter:4.8.1"
  testImplementation "com.google.guava:guava:32.1.2-jre"
  testImplementation "javax.annotation:javax.annotation-api:1.3.2"
}

def scanner_path = project.rootProject.projectDir.toString() + "/annotator-out/scanner.xml"
def nullaway_path = project.rootProject.projectDir.toString() + "/annotator-out/nullaway.xml"
import net.ltgt.gradle.errorprone.CheckSeverity
tasks.withType(JavaCompile) {
    // Don't run NullAway when -Derrorprone.disable=true provided on the CLI
    if (System.properties['errorprone.disable'] == 'true') {
        options.errorprone.disableAllChecks = true
        return
    }

  // remove the if condition if you want to run NullAway on test code
  if (!name.toLowerCase().contains("test")) {
    options.errorprone.disableAllChecks = true
    options.errorprone.disableAllWarnings = true
    options.errorprone {
      check("NullAway", CheckSeverity.ERROR)
      check("AnnotatorScanner", CheckSeverity.ERROR)
      option("NullAway:AnnotatedPackages", "retrofit2")
      option("NullAway:SerializeFixMetadata", "true")
      option("NullAway:FixSerializationConfigPath", nullaway_path)
      option("AnnotatorScanner:ConfigPath", scanner_path)
    }
  }
  options.compilerArgs << "-Xmaxerrs" << "100000"
  options.compilerArgs << "-Xmaxwarns" << "100000"
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += [
          "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
          "--add-exports=jdk.compiler/com.sun.source.tree=ALL-UNNAMED",
  ]
}

jar {
  manifest {
    attributes  'Automatic-Module-Name': 'retrofit2'
  }
}
